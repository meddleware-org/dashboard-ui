name: Node CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs the same checks on the tagged commit.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # The npm bundled with Node 24.13 (11.6.2) cannot verify the attestations of recently published packages
      # (EMISSINGSIGNATUREKEY); the release workflow pins the same client.
      - name: Upgrade npm
        run: npm install -g npm@11.20.0

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npx mw-audit-gate

      - name: Shared files are current
        run: npx mw-sync --check

      - name: Verify registry signatures and provenance
        run: npm audit signatures

      - name: Type-check
        run: npm run type-check

      - name: Lint CSS (stylelint)
        run: npm run lint:css

      - name: Lint JS (eslint + vuejs-a11y)
        run: npm run lint:js

      - name: Lint HTML (html-validate)
        run: npm run lint:html

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Production build carries no e2e harness
        run: npm run check:bundle

      - name: A production build refuses VITE_E2E
        run: |
          if VITE_E2E=1 npx vite build --outDir "$RUNNER_TEMP/refused" > /dev/null 2>&1; then
            echo "::error::a production build with VITE_E2E=1 succeeded: the e2e harness could be shipped"
            exit 1
          fi

      - name: Package contents (no e2e harness in the tarball)
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const j = JSON.parse(require('fs').readFileSync('pack.json', 'utf8'))
            const p = Array.isArray(j) ? j[0] : Object.values(j)[0] // npm 12 keys the report by package name
            const bad = p.files.map((f) => f.path).filter((f) => /(^|\\/)e2e/.test(f))
            if (bad.length) { console.error('e2e files in the tarball:', bad); process.exit(1) }
          "

      - name: Inline scripts are covered by the CSP
        run: npm run check:csp

      - name: Third-party licence notices
        run: npm run check:licenses && test -s dist/THIRD_PARTY_LICENSES

      # Lighthouse runs on the production build; the browser tests then rebuild it in e2e mode (a mock wallet and an empty stub chain).
      - name: Lighthouse (accessibility 100, best practices, bundle budgets)
        run: npx lhci autorun

      # Every route and every embedded tool mounts in a real browser, with no network, on five browsers (WCAG 2.2 AA, reflow, keyboard).
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser tests (routes, tool tabs, accessibility sweep)
        run: npm run test:e2e
        env:
          E2E_BROWSERS: all

  image:
    name: Image (build and probe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not pushed. Builds the Dockerfile as the release does (the inline-script check included) and runs the
      # container the way the cluster does: non-root user, read-only root, no capabilities.
      - name: Build (not pushed)
        run: docker build --tag dashboard:ci .
      - name: Probe the container (user, /, headers, SPA fallback, bundle, licences)
        run: bash scripts/smoke.sh dashboard:ci

  scan:
    name: Filesystem and configuration scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan (vulnerabilities, Dockerfile misconfiguration, secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          version: v0.74.0
